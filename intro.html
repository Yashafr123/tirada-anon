<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TiradA anon — интро (превью)</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; }
  body {
    background:#020202; color:#fff; overflow:hidden;
    font-family:"Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
    -webkit-user-select:none; user-select:none;
    -webkit-tap-highlight-color: transparent;
  }
  #stage { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; cursor:pointer; }

  /* ambient red haze */
  #haze { position:absolute; inset:0; pointer-events:none;
    background:radial-gradient(60% 45% at 50% 38%, rgba(255,30,30,.16), rgba(255,30,30,0) 70%);
    opacity:0; animation:hazeIn 1.2s ease .9s forwards; }
  @keyframes hazeIn { to { opacity:1; } }

  /* neon sign */
  #sign { width:min(46vw, 210px); aspect-ratio:1; position:relative; z-index:3;
    opacity:.06; filter:grayscale(.6) brightness(.5);
    animation:neonOn 1.15s linear .25s forwards; }
  #sign img { width:100%; height:100%; display:block; border-radius:18%; }
  @keyframes neonOn {
    0% { opacity:.06; filter:grayscale(.6) brightness(.5) drop-shadow(0 0 0 rgba(255,30,30,0)); }
    8% { opacity:.9;  filter:none drop-shadow(0 0 22px rgba(255,30,30,.85)); }
    14% { opacity:.15; filter:grayscale(.5) brightness(.6) drop-shadow(0 0 0 rgba(255,30,30,0)); }
    22% { opacity:1;   filter:none drop-shadow(0 0 30px rgba(255,30,30,.95)); }
    30% { opacity:.3;  filter:brightness(.7) drop-shadow(0 0 6px rgba(255,30,30,.4)); }
    42% { opacity:1;   filter:none drop-shadow(0 0 34px rgba(255,30,30,1)); }
    55% { opacity:.55; filter:brightness(.85) drop-shadow(0 0 12px rgba(255,30,30,.6)); }
    100% { opacity:1;  filter:none drop-shadow(0 0 26px rgba(255,30,30,.9)); }
  }
  #sign.lit { animation:neonPulse 2.6s ease-in-out infinite; }
  @keyframes neonPulse {
    0%,100% { filter:none drop-shadow(0 0 22px rgba(255,30,30,.8)); }
    50%     { filter:none drop-shadow(0 0 36px rgba(255,30,30,1)); }
  }

  /* title */
  #title { margin-top:26px; text-align:center; z-index:3; opacity:0; transform:translateY(10px) scale(.96);
    animation:titleIn .45s cubic-bezier(.2,1.6,.4,1) 1.35s forwards; }
  @keyframes titleIn { to { opacity:1; transform:none; } }
  #title .name { font-size:min(13vw, 58px); font-weight:900; letter-spacing:.06em; line-height:1;
    color:#fff; text-shadow:0 0 6px rgba(255,30,30,.9), 0 0 22px rgba(255,30,30,.75), 0 0 60px rgba(255,30,30,.5); }
  #title .name b { color:#ff2a1e; font-weight:900; }
  #title .sub { margin-top:9px; font-size:min(3.6vw, 14px); letter-spacing:.42em; text-transform:uppercase; color:#ffb3ad; opacity:.85; text-indent:.42em; }

  /* skyline */
  #sky { position:absolute; left:0; right:0; bottom:0; height:19vh; z-index:1; opacity:0; animation:hazeIn 1s ease .8s forwards; }
  #sky svg { width:100%; height:100%; display:block; }
  .win { fill:#ffcf3f; opacity:.85; animation:winBlink 3.4s steps(1) infinite; }
  .win.w2 { animation-delay:1.1s; } .win.w3 { animation-delay:2.2s; }
  @keyframes winBlink { 0%,92% { opacity:.85; } 94%,98% { opacity:.15; } 100% { opacity:.85; } }

  /* floating ghosts */
  .ghost { position:absolute; bottom:12vh; font-size:26px; z-index:2; opacity:0; filter:drop-shadow(0 0 8px rgba(255,255,255,.35)); }
  .g1 { left:16%; animation:floatUp 3.6s ease-in 1.5s infinite; }
  .g2 { left:78%; font-size:20px; animation:floatUp 4.3s ease-in 2.1s infinite; }
  .g3 { left:58%; font-size:17px; animation:floatUp 3.9s ease-in 2.8s infinite; }
  @keyframes floatUp {
    0% { transform:translateY(0) translateX(0); opacity:0; }
    12% { opacity:.9; }
    50% { transform:translateY(-13vh) translateX(8px); }
    88% { opacity:.7; }
    100% { transform:translateY(-26vh) translateX(-6px); opacity:0; }
  }

  /* loading, game style */
  #loader { position:absolute; left:50%; transform:translateX(-50%); bottom:23vh; width:min(74vw, 340px); z-index:4; text-align:center; }
  #loadLabel { font-size:12px; letter-spacing:.34em; text-transform:uppercase; color:#ffb3ad; margin-bottom:9px; text-indent:.34em; }
  #barOuter { height:10px; border:1px solid rgba(255,42,30,.75); border-radius:6px; padding:2px; background:rgba(255,42,30,.08); box-shadow:0 0 14px rgba(255,30,30,.35), inset 0 0 8px rgba(0,0,0,.7); }
  #barFill { height:100%; width:0%; border-radius:3px; background:linear-gradient(90deg,#8f0f16,#ff1e1e,#ff5a3c); box-shadow:0 0 12px rgba(255,30,30,.85); transition:width .12s linear; }
  #loadPct { margin-top:8px; font-size:13px; font-weight:700; letter-spacing:.22em; color:#fff; text-shadow:0 0 8px rgba(255,30,30,.8); }

  /* press start */
  #pressStart { position:absolute; left:50%; transform:translateX(-50%); bottom:23vh; z-index:4;
    font-size:min(5.4vw, 21px); font-weight:900; letter-spacing:.3em; text-transform:uppercase; text-indent:.3em;
    color:#fff; text-shadow:0 0 10px rgba(255,30,30,.95), 0 0 34px rgba(255,30,30,.6);
    opacity:0; pointer-events:none; white-space:nowrap; }
  #pressStart.show { opacity:1; animation:blinkStart 1.15s steps(1) infinite; }
  @keyframes blinkStart { 0%,62% { opacity:1; } 63%,100% { opacity:.12; } }

  /* end card (preview only) */
  #endcard { position:fixed; inset:0; background:#020202; z-index:9; display:none; flex-direction:column; align-items:center; justify-content:center; gap:18px; text-align:center; padding:24px; }
  #endcard.show { display:flex; }
  #endcard .big { font-size:22px; font-weight:800; }
  #endcard .small { color:#ffb3ad; font-size:14px; line-height:1.5; }
  #replay { margin-top:6px; background:#e50914; color:#fff; border:none; border-radius:12px; padding:13px 26px; font-size:16px; font-weight:800; letter-spacing:.08em; cursor:pointer; box-shadow:0 0 18px rgba(255,30,30,.5); }

  #fadeout { position:fixed; inset:0; background:#000; opacity:0; pointer-events:none; transition:opacity .38s ease; z-index:8; }
  #fadeout.on { opacity:1; }
  #hint { position:absolute; top:calc(10px + env(safe-area-inset-top)); right:14px; z-index:5; font-size:11px; letter-spacing:.18em; color:rgba(255,255,255,.4); text-transform:uppercase; }
</style>
</head>
<body>
<div id="stage">
  <div id="haze"></div>
  <div id="hint">нажми — пропустить</div>

  <div id="sign"><img src="icon-512.png" alt="TiradA"></div>
  <div id="title">
    <div class="name">Tirad<b>A</b> <span style="font-weight:300">anon</span></div>
    <div class="sub">город оживает ночью</div>
  </div>

  <div class="ghost g1">👻</div>
  <div class="ghost g2">👻</div>
  <div class="ghost g3">👻</div>

  <div id="sky">
    <svg viewBox="0 0 100 24" preserveAspectRatio="none" aria-hidden="true">
      <path d="M0,24 L0,14 L7,14 L7,9 L13,9 L13,16 L19,16 L19,6 L26,6 L26,13 L33,13 L33,10 L40,10 L40,18 L47,18 L47,7 L55,7 L55,15 L62,15 L62,11 L69,11 L69,17 L76,17 L76,8 L83,8 L83,14 L90,14 L90,10 L100,10 L100,24 Z" fill="#070708"/>
      <rect class="win"    x="21.5" y="9"  width="1.6" height="2.2"/>
      <rect class="win w2" x="49.5" y="10" width="1.6" height="2.2"/>
      <rect class="win w3" x="78.5" y="11" width="1.6" height="2.2"/>
      <rect class="win w2" x="8.5"  y="11" width="1.4" height="2"/>
      <rect class="win w3" x="64"   y="13" width="1.4" height="2"/>
    </svg>
  </div>

  <div id="loader">
    <div id="loadLabel">Загрузка города</div>
    <div id="barOuter"><div id="barFill"></div></div>
    <div id="loadPct">0%</div>
  </div>
  <div id="pressStart">▶ Нажми старт</div>
</div>

<div id="fadeout"></div>
<div id="endcard">
  <div class="big">Дальше — само приложение 👻</div>
  <div class="small">Это превью интро: в игре после «старта»<br>сразу открывается карта.</div>
  <button id="replay">↻ Смотреть ещё раз</button>
</div>

<script>
  var pct = 0, done = false;
  var fill = document.getElementById('barFill');
  var pctEl = document.getElementById('loadPct');
  var loader = document.getElementById('loader');
  var press = document.getElementById('pressStart');
  var sign = document.getElementById('sign');
  var fade = document.getElementById('fadeout');
  var endcard = document.getElementById('endcard');

  var timer = setInterval(function(){
    /* game-style uneven loading: fast, stall, fast */
    var step = pct < 55 ? 3.2 : (pct < 78 ? 1.1 : 4.6);
    pct = Math.min(100, pct + step * (0.6 + Math.random() * 0.9));
    fill.style.width = pct + '%';
    pctEl.textContent = Math.floor(pct) + '%';
    if (pct >= 100) finishLoading();
  }, 90);

  function finishLoading(){
    if (done) return; done = true;
    clearInterval(timer);
    fill.style.width = '100%'; pctEl.textContent = '100%';
    sign.classList.add('lit');
    setTimeout(function(){
      loader.style.display = 'none';
      press.classList.add('show');
    }, 320);
  }

  function start(){
    if (!done) { finishLoading(); return; }
    fade.classList.add('on');
    setTimeout(function(){ endcard.classList.add('show'); }, 400);
  }
  document.getElementById('stage').addEventListener('click', start);
  document.getElementById('replay').addEventListener('click', function(){ location.reload(); });
</script>
</body>
</html>

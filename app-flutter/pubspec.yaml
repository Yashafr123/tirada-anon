name: tirada_anon
description: TiradA anon — ghost city quest. Native app.
publish_to: 'none'
version: 2.0.0+4

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.8.4
  maplibre_gl: ^0.27.1

dev_dependencies:
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/places.json
    - assets/cities.json
    - assets/map-style.json
    - assets/tasks.json
    - assets/icon.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"
  adaptive_icon_background: "#050505"
  adaptive_icon_foreground: "assets/icon.png"

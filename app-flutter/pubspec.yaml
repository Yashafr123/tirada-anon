name: tirada_anon
description: TiradA anon — ghost city quest. Native app.
publish_to: 'none'
version: 2.0.26+30

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.8.4
  maplibre_gl: ^0.27.1
  shared_preferences: ^2.3.3
  url_launcher: ^6.3.1
  image_picker: ^1.1.2
  share_plus: ^10.1.4
  pedometer: ^4.1.1
  permission_handler: ^11.3.1
  image: ^4.3.0
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.6
  flutter_local_notifications: ^18.0.1
  geolocator: ^14.0.2

dev_dependencies:
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/places.json
    - assets/cities.json
    - assets/map-style.json
    - assets/tasks.json
    - assets/icon.png
    - assets/stickers/
  fonts:
    - family: Inter
      fonts:
        - asset: fonts/Inter-Medium.ttf
          weight: 500
        - asset: fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: fonts/Inter-Bold.ttf
          weight: 700
        - asset: fonts/Inter-ExtraBold.ttf
          weight: 800
    - family: Montserrat
      fonts:
        - asset: fonts/Montserrat-Bold.ttf
          weight: 700
        - asset: fonts/Montserrat-ExtraBold.ttf
          weight: 800
        - asset: fonts/Montserrat-Black.ttf
          weight: 900
    - family: Unbounded
      fonts:
        - asset: fonts/Unbounded-Medium.ttf
          weight: 500
        - asset: fonts/Unbounded-Bold.ttf
          weight: 700
        - asset: fonts/Unbounded-Black.ttf
          weight: 900

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"
  adaptive_icon_background: "#050505"
  adaptive_icon_foreground: "assets/icon.png"

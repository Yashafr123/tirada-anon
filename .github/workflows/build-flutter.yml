name: Build native Flutter APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Scaffold the Android project and overlay the app sources
        run: |
          mkdir work
          cd work
          flutter create --platforms android --project-name tirada_anon --org app.tirada .
          rm -rf lib test
          cp -r $GITHUB_WORKSPACE/app-flutter/lib lib
          cp -r $GITHUB_WORKSPACE/app-flutter/assets assets
          cp $GITHUB_WORKSPACE/app-flutter/pubspec.yaml pubspec.yaml
          cp -r $GITHUB_WORKSPACE/app-flutter/fonts fonts
          ls lib assets

      - name: Patch package id, label, permissions, launch background, signing
        working-directory: work
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          openssl enc -d -aes-256-cbc -pbkdf2 -in $GITHUB_WORKSPACE/app-flutter/keystore.enc -out /tmp/tirada.keystore -pass env:KEYSTORE_PASSWORD
          echo "keystore md5: $(md5sum /tmp/tirada.keystore | cut -d' ' -f1)"
          echo "secret lengths: store=${#KEYSTORE_PASSWORD} key=${#KEY_PASSWORD} alias=${#KEY_ALIAS} alias=[$KEY_ALIAS]"
          keytool -list -keystore /tmp/tirada.keystore -storepass "$KEYSTORE_PASSWORD" 2>&1 | head -5
          keytool -importkeystore -srckeystore /tmp/tirada.keystore -srcstorepass "$KEYSTORE_PASSWORD" -srckeypass "$KEY_PASSWORD" -srcalias "$KEY_ALIAS" -destkeystore /tmp/verify.p12 -deststoretype PKCS12 -deststorepass "$KEYSTORE_PASSWORD" -destkeypass "$KEY_PASSWORD" >/dev/null 2>&1 && echo KEY_READ_OK || { echo KEY_READ_FAILED; exit 1; }
          python3 - << 'PY'
          import glob
          # --- build.gradle.kts: applicationId + version + release signing ---
          p = 'android/app/build.gradle.kts'
          s = open(p).read()
          s = s.replace('applicationId = "app.tirada.tirada_anon"', 'applicationId = "app.tirada.anon"')
          s = s.replace('versionCode = 1', 'versionCode = 31')
          s = s.replace('versionName = "1.0"', 'versionName = "2.0.27"')
          s += '''

          android {
              signingConfigs {
                  create("release") {
                      storeFile = file("/tmp/tirada.keystore")
                      storePassword = System.getenv("KEYSTORE_PASSWORD")
                      keyAlias = System.getenv("KEY_ALIAS")
                      keyPassword = System.getenv("KEY_PASSWORD")
                  }
              }
              buildTypes {
                  getByName("release") {
                      signingConfig = signingConfigs.getByName("release")
                  }
              }
          }

          android {
              compileOptions {
                  isCoreLibraryDesugaringEnabled = true
              }
          }
          dependencies {
              coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")
          }
          '''
          open(p, 'w').write(s)
          # --- AndroidManifest: label + permissions ---
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p).read()
          s = s.replace('android:label="tirada_anon"', 'android:label="TiradA anon"')
          perms = '\n    '.join([
              '<uses-permission android:name="android.permission.INTERNET" />',
              '<uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />',
              '<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />',
              '<uses-permission android:name="android.permission.ACCESS_BACKGROUND_LOCATION" />',
              '<uses-permission android:name="android.permission.FOREGROUND_SERVICE" />',
              '<uses-permission android:name="android.permission.FOREGROUND_SERVICE_LOCATION" />',
              '<uses-permission android:name="android.permission.CAMERA" />',
              '<uses-permission android:name="android.permission.ACTIVITY_RECOGNITION" />',
              '<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />',
          ]) + '\n    '
          s = s.replace('<application', perms + '<application', 1)
          open(p, 'w').write(s)
          # --- launch background: plain black, no white flash ---
          for f in glob.glob('android/app/src/main/res/drawable*/launch_background.xml'):
              open(f, 'w').write('<?xml version="1.0" encoding="utf-8"?>\n'
                  '<layer-list xmlns:android="http://schemas.android.com/apk/res/android">\n'
                  '    <item android:drawable="@android:color/black" />\n'
                  '</layer-list>\n')
          print('patched')
          PY

      - name: Wire Firebase (google-services.json + Gradle plugin)
        working-directory: work
        run: |
          cp $GITHUB_WORKSPACE/app-flutter/google-services.json android/app/google-services.json
          ls -la android/app/google-services.json
          python3 - << 'PY'
          import os, sys

          def patch_plugins(path, insert_line, marker):
              if not os.path.exists(path):
                  return False
              s = open(path).read()
              if marker in s:
                  print(path + ': google-services plugin already present')
                  return True
              idx = s.find('plugins {')
              if idx < 0:
                  return False
              nl = s.find('\n', idx)
              s = s[:nl + 1] + insert_line + '\n' + s[nl + 1:]
              open(path, 'w').write(s)
              print(path + ': plugin inserted')
              return True

          ok_settings = False
          for cand, line in [
              ('android/settings.gradle.kts', '    id("com.google.gms.google-services") version "4.4.2" apply false'),
              ('android/settings.gradle', "    id 'com.google.gms.google-services' version '4.4.2' apply false"),
          ]:
              if os.path.exists(cand):
                  ok_settings = patch_plugins(cand, line, 'com.google.gms.google-services')
                  break
          ok_app = False
          for cand, line in [
              ('android/app/build.gradle.kts', '    id("com.google.gms.google-services")'),
              ('android/app/build.gradle', "    id 'com.google.gms.google-services'"),
          ]:
              if os.path.exists(cand):
                  ok_app = patch_plugins(cand, line, 'com.google.gms.google-services')
                  break
          if not (ok_settings and ok_app):
              print('ERROR: could not patch google-services plugin into gradle files')
              sys.exit(1)
          print('google-services gradle wiring OK')
          PY

      - name: Build the signed release APK
        working-directory: work
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          flutter pub get
          dart run flutter_launcher_icons
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk /tmp/TiradA-flutter.apk
          ls -la /tmp/TiradA-flutter.apk

      - name: Publish the APK to the standing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view app-latest >/dev/null 2>&1 || gh release create app-latest --title "TiradA anon — native app" --notes "Native build"
          gh release upload app-latest /tmp/TiradA-flutter.apk --clobber

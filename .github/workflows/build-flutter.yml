name: Build native Flutter APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: 'stable'

      - name: Scaffold the Android project and overlay the app sources
        run: |
          mkdir work
          cd work
          flutter create --platforms android --project-name tirada_anon --org app.tirada .
          rm -rf lib test
          cp -r $GITHUB_WORKSPACE/app-flutter/lib lib
          cp -r $GITHUB_WORKSPACE/app-flutter/assets assets
          cp $GITHUB_WORKSPACE/app-flutter/pubspec.yaml pubspec.yaml
          ls lib assets

      - name: Patch package id, label, permissions, launch background, signing
        working-directory: work
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > /tmp/tirada.keystore
          cat > android/key.properties << KEYS
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=/tmp/tirada.keystore
          KEYS
          python3 - << 'PY'
          import glob
          # --- build.gradle.kts: applicationId + version + release signing ---
          p = 'android/app/build.gradle.kts'
          s = open(p).read()
          s = s.replace('applicationId = "app.tirada.tirada_anon"', 'applicationId = "app.tirada.anon"')
          s = s.replace('versionCode = 1', 'versionCode = 4')
          s = s.replace('versionName = "1.0"', 'versionName = "2.0.0"')
          s += '''

          val keystoreProperties = java.util.Properties()
          val keystoreFile = rootProject.file("key.properties")
          if (keystoreFile.exists()) {
              keystoreProperties.load(java.io.FileInputStream(keystoreFile))
          }
          android {
              signingConfigs {
                  create("release") {
                      keyAlias = keystoreProperties["keyAlias"] as String
                      keyPassword = keystoreProperties["keyPassword"] as String
                      storeFile = file(keystoreProperties["storeFile"] as String)
                      storePassword = keystoreProperties["storePassword"] as String
                  }
              }
              buildTypes {
                  getByName("release") {
                      signingConfig = signingConfigs.getByName("release")
                  }
              }
          }
          '''
          open(p, 'w').write(s)
          # --- AndroidManifest: label + permissions ---
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p).read()
          s = s.replace('android:label="tirada_anon"', 'android:label="TiradA anon"')
          perms = ('<uses-permission android:name="android.permission.INTERNET" />\n    '
                   '<uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    '
                   '<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    '
                   '<uses-permission android:name="android.permission.CAMERA" />\n    ')
          s = s.replace('<application', perms + '<application', 1)
          open(p, 'w').write(s)
          # --- launch background: plain black, no white flash ---
          for f in glob.glob('android/app/src/main/res/drawable*/launch_background.xml'):
              open(f, 'w').write('<?xml version="1.0" encoding="utf-8"?>\n'
                  '<layer-list xmlns:android="http://schemas.android.com/apk/res/android">\n'
                  '    <item android:drawable="@android:color/black" />\n'
                  '</layer-list>\n')
          print('patched')
          PY

      - name: Build the signed release APK
        working-directory: work
        run: |
          flutter pub get
          dart run flutter_launcher_icons
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk /tmp/TiradA-flutter.apk
          ls -la /tmp/TiradA-flutter.apk

      - name: Publish the APK to the standing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view app-latest >/dev/null 2>&1 || gh release create app-latest --title "TiradA anon — native app" --notes "Native build"
          gh release upload app-latest /tmp/TiradA-flutter.apk --clobber

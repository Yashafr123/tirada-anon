name: Build native APK (Capacitor)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Assemble web bundle from the live site files
        run: |
          mkdir -p native-app/www
          for f in index.html app.js style.css i18n.js places-data.js map-style.js vendor-supabase.js manifest.webmanifest icon-512.png icon-192.png apple-touch-icon.png tirada-logo.jpg diag.html; do
            cp "$f" native-app/www/
          done
          ls native-app/www

      - name: Install Capacitor and generate the Android project
        working-directory: native-app
        run: |
          npm install
          npx cap add android

      - name: App icon (Yasha's emblem) and plain black splash
        working-directory: native-app
        run: |
          python3 -m pip install --quiet pillow
          python3 - << 'PYEOF'
          import os, shutil
          from PIL import Image
          res = 'android/app/src/main/res'
          icon = Image.open('assets/icon.png').convert('RGB')
          sizes = {'mdpi': 48, 'hdpi': 72, 'xhdpi': 96, 'xxhdpi': 144, 'xxxhdpi': 192}
          for dens, px in sizes.items():
              out = f'{res}/mipmap-{dens}/ic_launcher.png'
              icon.resize((px, px), Image.LANCZOS).save(out)
              shutil.copy(out, f'{res}/mipmap-{dens}/ic_launcher_round.png')
          for f in ['mipmap-anydpi-v26/ic_launcher.xml',
                    'mipmap-anydpi-v26/ic_launcher_round.xml',
                    'drawable-v24/ic_launcher_foreground.xml']:
              p = os.path.join(res, f)
              if os.path.exists(p):
                  os.remove(p)
          black_p = Image.new('RGB', (480, 800), (5, 5, 5))
          black_l = Image.new('RGB', (800, 480), (5, 5, 5))
          black_p.save(f'{res}/drawable/splash.png')
          for d in os.listdir(res):
              if d.startswith('drawable-port-'):
                  black_p.save(f'{res}/{d}/splash.png')
              elif d.startswith('drawable-land-'):
                  black_l.save(f'{res}/{d}/splash.png')
          print('icons and splash set')
          PYEOF

      - name: Permissions + version (location for the map, camera for photo tasks)
        working-directory: native-app
        run: |
          python3 - << 'PY'
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p).read()
          perms = ('<uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    '
                   '<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    '
                   '<uses-permission android:name="android.permission.CAMERA" />\n    ')
          s = s.replace('<application', perms + '<application', 1)
          open(p, 'w').write(s)
          g = 'android/app/build.gradle'
          s = open(g).read()
          s = s.replace('versionCode 1', 'versionCode 4')
          s = s.replace('versionName "1.0"', 'versionName "2.0.0"')
          open(g, 'w').write(s)
          print('manifest + version patched')
          PY

      - name: Build signed release APK (same key as the TWA builds)
        working-directory: native-app/android
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > /tmp/tirada.keystore
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=/tmp/tirada.keystore \
            -Pandroid.injected.signing.store.password="$STORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
          cp app/build/outputs/apk/release/app-release.apk /tmp/TiradA-native.apk
          ls -la /tmp/TiradA-native.apk

      - name: Publish the APK to the standing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view app-latest >/dev/null 2>&1 || gh release create app-latest --title "TiradA anon — native app" --notes "Capacitor native build"
          gh release upload app-latest /tmp/TiradA-native.apk --clobber

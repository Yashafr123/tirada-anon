<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TiradA — диагностика</title>
<style>
  html,body{margin:0;padding:0;background:#0b0f0c;color:#e8f0e8;
    font-family:ui-monospace,Menlo,Consolas,"Courier New",monospace;
    font-size:16px;line-height:1.45;}
  #wrap{padding:12px 12px 40px;}
  h1{font-size:19px;margin:4px 0 10px;color:#ff5a5a;}
  h2{font-size:17px;margin:18px 0 6px;color:#ffd75a;border-top:1px solid #2a3a2a;padding-top:10px;}
  .line{white-space:pre-wrap;word-break:break-word;overflow-wrap:anywhere;margin:3px 0;}
  .ok{color:#7dff8a;} .bad{color:#ff7d7d;} .dim{color:#9db39d;}
  #mapbox{width:100%;height:300px;background:#0b100c;border:1px solid #2a3a2a;margin:8px 0;}
  #foot{margin-top:22px;border-top:1px solid #2a3a2a;padding-top:10px;color:#ffd75a;}
</style>
</head>
<body>
<div id="wrap">
  <h1>TiradA anon — диагностика телефона</h1>
  <div id="out"></div>
  <h2>КАРТА (живой тест)</h2>
  <div id="mapbox"></div>
  <div id="mapout"></div>
  <div id="foot"></div>
</div>
<script>
"use strict";
var T0 = Date.now();
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;"); }
function line(txt, cls, target){
  var d = document.createElement("div");
  d.className = "line" + (cls ? " " + cls : "");
  d.innerHTML = esc(txt);
  ($(target || "out")).appendChild(d);
}
function sec(t){ var h = document.createElement("h2"); h.textContent = t; $("out").appendChild(h); }
function secs(){ return ((Date.now() - T0) / 1000).toFixed(1); }
window.addEventListener("error", function(e){
  line("JS-ОШИБКА СТРАНИЦЫ: " + (e.message || e.type), "bad");
});

/* ---------- 1. Версии файлов ---------- */
function stamp(text, re){
  if (text == null) return "файл не получен";
  var m = String(text).match(re);
  return m ? m[1] : "штамп не найден";
}
function fetchText(url, opts){
  return Promise.resolve().then(function(){ return fetch(url, opts); }).then(function(r){
    return r.text().then(function(t){ return { status: r.status, text: t }; });
  });
}
function versionRow(label, url, re, opts){
  return fetchText(url, opts).then(function(res){
    line(label + ": " + stamp(res.text, re) + " (http " + res.status + ")", "");
  }).catch(function(e){
    line(label + ": ОШИБКА fetch — " + (e && e.message ? e.message : e), "bad");
  });
}
var RE_BUILD = /TIRADA_BUILD\s*=\s*"([^"]+)"/;
var RE_APP   = /APP_BUILD\s*=\s*"([^"]+)"/;
var RE_CACHE = /(tirada-shell-v[0-9]+)/;
function versions(){
  sec("1. ВЕРСИИ ФАЙЛОВ");
  line("— напрямую с сервера (cache: no-store) —", "dim");
  return versionRow("index.html [no-store] TIRADA_BUILD", "index.html", RE_BUILD, { cache: "no-store" })
  .then(function(){ return versionRow("app.js [no-store] APP_BUILD", "app.js", RE_APP, { cache: "no-store" }); })
  .then(function(){ return versionRow("sw.js [no-store] кэш", "sw.js", RE_CACHE, { cache: "no-store" }); })
  .then(function(){
    line("— как отдаёт SW/кэш этого телефона (обычный fetch) —", "dim");
    return versionRow("index.html [обычный] TIRADA_BUILD", "index.html", RE_BUILD, undefined);
  })
  .then(function(){ return versionRow("app.js [обычный] APP_BUILD", "app.js", RE_APP, undefined); })
  .then(function(){ return versionRow("sw.js [обычный] кэш", "sw.js", RE_CACHE, undefined); })
  .then(function(){
    line("КАК ЧИТАТЬ: если [no-store] и [обычный] отличаются — телефон крутит СМЕСЬ версий из кэша.", "dim");
  });
}

/* ---------- 2. Service Workers и кэши ---------- */
function swInfo(){
  sec("2. SERVICE WORKER");
  if (!("serviceWorker" in navigator)){
    line("serviceWorker: НЕ поддерживается браузером", "bad");
    return Promise.resolve();
  }
  var ctrl = navigator.serviceWorker.controller;
  line("Контроллер страницы: " + (ctrl ? "ЕСТЬ — " + ctrl.scriptURL : "НЕТ (страница не под SW)"), ctrl ? "" : "bad");
  return navigator.serviceWorker.getRegistrations().then(function(regs){
    line("Регистраций SW: " + regs.length, regs.length ? "" : "bad");
    regs.forEach(function(r, i){
      function st(w){ return w ? w.state + " " + w.scriptURL : "нет"; }
      line("SW #" + (i + 1) + " scope: " + r.scope, "dim");
      line("SW #" + (i + 1) + " active: " + st(r.active), "");
      line("SW #" + (i + 1) + " waiting: " + st(r.waiting), "");
      line("SW #" + (i + 1) + " installing: " + st(r.installing), "");
    });
  }).catch(function(e){
    line("getRegistrations ОШИБКА: " + (e && e.message ? e.message : e), "bad");
  }).then(function(){
    if (!("caches" in window)){ line("Cache Storage: НЕ поддерживается", "bad"); return; }
    return caches.keys().then(function(keys){
      line("Кэшей Cache Storage: " + keys.length, "");
      keys.forEach(function(k){ line("кэш: " + k, "dim"); });
      if (!keys.length) line("кэш: (список пуст)", "dim");
    }).catch(function(e){
      line("caches.keys ОШИБКА: " + (e && e.message ? e.message : e), "bad");
    });
  });
}

/* ---------- 3. localStorage: журнал boot и флаги ---------- */
function lsInfo(){
  sec("3. ЖУРНАЛ ЗАГРУЗКИ (localStorage)");
  var raw = null;
  try { raw = localStorage.getItem("tirada_boot_errors"); } catch(e){}
  if (raw == null){
    line("tirada_boot_errors: ОТСУТСТВУЕТ (приложение на этом телефоне журнал не писало)", "bad");
  } else {
    line("tirada_boot_errors длина строки: " + raw.length + " символов", "");
    var arr = null;
    try { arr = JSON.parse(raw); } catch(e){}
    if (Array.isArray(arr)){
      line("tirada_boot_errors записей: " + arr.length, "");
      var tail = arr.slice(-10);
      line("— хвост, последние " + tail.length + " записей, как есть —", "dim");
      tail.forEach(function(en, i){
        line("[" + (arr.length - tail.length + i + 1) + "] " + (typeof en === "string" ? en : JSON.stringify(en)), "dim");
      });
    } else {
      line("tirada_boot_errors: не массив/не JSON, сырой хвост:", "bad");
      line(raw.slice(-1200), "dim");
    }
  }
  var healed = [];
  function scan(store, name){
    if (!store) return;
    try {
      for (var i = 0; i < store.length; i++){
        var k = store.key(i);
        if (k && k.indexOf("tirada_healed") === 0) healed.push(name + " " + k + " = " + store.getItem(k));
      }
    } catch(e){}
  }
  scan(window.localStorage, "localStorage");
  scan(window.sessionStorage, "sessionStorage");
  if (healed.length) healed.forEach(function(h){ line("флаг самовосстановления: " + h, ""); });
  else line("флаги tirada_healed_*: нет ни одного", "dim");
}

/* ---------- 4. WebGL ---------- */
function webglInfo(){
  sec("4. WEBGL");
  function probe(name){
    try {
      var c = document.createElement("canvas");
      var gl = c.getContext(name) || c.getContext("experimental-" + name);
      return gl ? name : null;
    } catch(e){ return null; }
  }
  var got = probe("webgl2") || probe("webgl");
  line("WebGL контекст: " + (got ? "ПОЛУЧЕН (" + got + ")" : "НЕ получен ни webgl2, ни webgl"),
       got ? "ok" : "bad");
}

/* ---------- 6. Сеть до CARTO (sprite/glyphs из стиля) ---------- */
function timedFetch(label, url){
  var t = performance.now();
  return Promise.resolve().then(function(){ return fetch(url); }).then(function(r){
    var ms = Math.round(performance.now() - t);
    return r.text().then(function(){
      line(label + ": http " + r.status + " за " + ms + " мс", r.ok ? "ok" : "bad");
    });
  }).catch(function(e){
    var ms = Math.round(performance.now() - t);
    line(label + ": ОШИБКА за " + ms + " мс — " + (e && e.message ? e.message : e) +
         " (сеть/CORS — фиксируем как факт)", "bad");
  });
}
function cartoNet(){
  sec("6. СЕТЬ ДО CARTO");
  var st = window.TIRADA_MAP_STYLE;
  if (!st){ line("TIRADA_MAP_STYLE не загрузился — сеть до CARTO не проверить", "bad"); return Promise.resolve(); }
  var jobs = [];
  if (st.sprite) jobs.push(timedFetch("sprite.json", st.sprite + ".json"));
  else line("sprite в стиле: нет", "dim");
  if (st.glyphs){
    var font = "Open Sans Regular";
    try {
      for (var i = 0; i < st.layers.length; i++){
        var f = st.layers[i].layout && st.layers[i].layout["text-font"];
        if (f && f.length){ font = f[0]; break; }
      }
    } catch(e){}
    var gurl = st.glyphs.replace("{fontstack}", font).replace("{range}", "0-255");
    jobs.push(timedFetch("glyphs (" + font + " 0-255)", gurl));
  } else line("glyphs в стиле: нет", "dim");
  return Promise.all(jobs);
}

/* ---------- 5. Живой тест карты ---------- */
function loadScript(src){
  return new Promise(function(res, rej){
    var done = false;
    var s = document.createElement("script");
    s.src = src;
    s.onload = function(){ if (!done){ done = true; res(); } };
    s.onerror = function(){ if (!done){ done = true; rej(new Error("не загрузился " + src)); } };
    setTimeout(function(){ if (!done){ done = true; rej(new Error("таймаут 15 с загрузки " + src)); } }, 15000);
    document.head.appendChild(s);
  });
}
function loadCss(href){
  var l = document.createElement("link");
  l.rel = "stylesheet"; l.href = href;
  document.head.appendChild(l);
}
var mapState = { ctor: null, loadAt: null, errors: [], verdictDone: false };
function mapLine(t, c){ line(t, c, "mapout"); }
function snapshotMap(map, label){
  var canvas = $("mapbox").querySelector("canvas");
  var styleOk = "—";
  if (map){ try { styleOk = map.isStyleLoaded() ? "да" : "нет"; } catch(e){ styleOk = "ошибка"; } }
  mapLine("КАРТА @" + label + ": конструктор " + (mapState.ctor === true ? "ок" : mapState.ctor === false ? "ОШИБКА" : "—") +
          ", load " + (mapState.loadAt != null ? "был на " + mapState.loadAt + " с" : "ещё нет") +
          ", isStyleLoaded " + styleOk +
          ", канвас " + (canvas ? "стоит" : "НЕТ"), "");
}
function mapVerdict(txt, cls){
  if (mapState.verdictDone) return;
  mapState.verdictDone = true;
  mapLine("КАРТА: " + txt, cls);
}
function mapTest(){
  loadCss("maplibre-gl.css?v=21");
  return loadScript("maplibre-gl.js?v=21")
  .then(function(){ return loadScript("map-style.js?v=21"); })
  .then(function(){
    if (typeof maplibregl === "undefined") throw new Error("maplibregl undefined после загрузки");
    if (!window.TIRADA_MAP_STYLE) throw new Error("TIRADA_MAP_STYLE undefined после загрузки");
    var map;
    try {
      map = new maplibregl.Map({
        container: "mapbox",
        style: window.TIRADA_MAP_STYLE,
        center: [35.2960, 32.9155], /* Кармиэль */
        zoom: 12
      });
      mapState.ctor = true;
    } catch(e){
      mapState.ctor = false;
      mapVerdict("ошибка конструктора: " + (e && e.message ? e.message : e), "bad");
      return null;
    }
    map.on("load", function(){
      mapState.loadAt = secs();
      mapVerdict("load за " + mapState.loadAt + " с", "ok");
    });
    map.on("error", function(e){
      var msg = (e && e.error && e.error.message) ? e.error.message : JSON.stringify(e && e.error || e);
      mapState.errors.push(msg);
      mapLine("КАРТА событие error: " + msg, "bad");
    });
    [1, 3, 5, 10, 20].forEach(function(s){
      setTimeout(function(){ snapshotMap(map, s + " с"); }, s * 1000);
    });
    setTimeout(function(){
      if (mapState.loadAt == null)
        mapVerdict("не дождалась load за 20 с" +
          (mapState.errors.length ? "; ошибки: " + mapState.errors.join(" | ") : "; ошибок не было"), "bad");
    }, 20500);
    return map;
  })
  .catch(function(e){
    mapState.ctor = false;
    mapVerdict("ошибка загрузки библиотек: " + (e && e.message ? e.message : e), "bad");
    return null;
  });
}

/* ---------- запуск ---------- */
function fillFoot(){
  if ($("foot").innerHTML) return;
  $("foot").innerHTML =
    "<div class='line'>Время старта теста: " + esc(new Date(T0).toLocaleString()) + "</div>" +
    "<div class='line'>Сфоткай этот экран целиком (можно в 2 приёма) и пришли Яше в чат.</div>";
}
setTimeout(fillFoot, 40000); /* страховка: подпись появится, даже если что-то зависло */
line("Старт диагностики: " + new Date().toLocaleString(), "dim");
line("Адрес страницы: " + location.href, "dim");
line("Браузер (userAgent): " + navigator.userAgent, "dim");
versions()
.then(swInfo)
.then(function(){ lsInfo(); webglInfo(); })
.then(mapTest)
.then(cartoNet)
.then(fillFoot);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TiradA anon — интро 2: кинематографичный зум</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; }
  body { background:#000; color:#fff; overflow:hidden;
    font-family:"Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
    -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent; }
  #stage { position:fixed; inset:0; overflow:hidden; cursor:pointer; }

  /* camera: the whole world scales toward the sign */
  #world { position:absolute; inset:0; transform-origin:50% 62%;
    animation:zoomIn 2.3s cubic-bezier(.55,0,.85,.4) .3s forwards; }
  @keyframes zoomIn { from { transform:scale(1); } to { transform:scale(3.1); } }

  #sky { position:absolute; inset:0;
    background:linear-gradient(180deg,#020208 0%,#0a0512 46%,#1c0710 78%,#2b0a10 100%); }
  .star { position:absolute; background:#fff; border-radius:50%; opacity:.7; animation:tw 2.8s ease-in-out infinite; }
  @keyframes tw { 0%,100% { opacity:.25; } 50% { opacity:.9; } }
  #moon { position:absolute; top:9%; right:12%; width:44px; height:44px; border-radius:50%;
    background:radial-gradient(circle at 38% 38%, #fff6da, #f3d98b 60%, #d9b45c);
    box-shadow:0 0 34px rgba(255,230,160,.5); }

  #city { position:absolute; left:0; right:0; bottom:0; height:46%; }
  #city svg { width:100%; height:100%; display:block; }
  .win { fill:#ffcf3f; opacity:.8; }
  #roofSign { position:absolute; left:50%; top:21%; transform:translateX(-50%);
    width:52px; height:52px; border-radius:14%;
    box-shadow:0 0 18px rgba(255,30,30,.95), 0 0 44px rgba(255,30,30,.55);
    animation:signGlow 1.6s ease-in-out infinite; }
  @keyframes signGlow { 0%,100% { box-shadow:0 0 14px rgba(255,30,30,.8), 0 0 34px rgba(255,30,30,.45);} 50% { box-shadow:0 0 22px rgba(255,30,30,1), 0 0 58px rgba(255,30,30,.7);} }

  /* impact flash + shake */
  #flash { position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none; }
  #flash.go { animation:flashA .5s ease-out 2.55s forwards; }
  @keyframes flashA { 0% { opacity:0; } 18% { opacity:.85; } 100% { opacity:0; } }
  #stage.shake { animation:shakeA .4s linear 2.6s; }
  @keyframes shakeA { 0%,100% { transform:translate(0,0);} 20% { transform:translate(-7px,3px);} 40% { transform:translate(6px,-4px);} 60% { transform:translate(-4px,-2px);} 80% { transform:translate(3px,2px);} }

  /* hero logo slam */
  #hero { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    opacity:0; pointer-events:none; }
  #hero.show { opacity:1; pointer-events:auto; }
  #heroSign { width:min(52vw, 230px); aspect-ratio:1; border-radius:18%;
    filter:drop-shadow(0 0 30px rgba(255,30,30,.9)); }
  #hero.show #heroSign { animation:slam .45s cubic-bezier(.2,2.2,.4,1) both; }
  @keyframes slam { from { transform:scale(2.6); opacity:0; } to { transform:scale(1); opacity:1; } }
  #heroName { margin-top:22px; font-size:min(13vw, 58px); font-weight:900; letter-spacing:.05em; line-height:1; text-align:center;
    text-shadow:0 0 8px rgba(255,30,30,.9), 0 0 30px rgba(255,30,30,.6); }
  #heroName b { color:#ff2a1e; }
  #hero.show #heroName { animation:slam .45s cubic-bezier(.2,2.2,.4,1) .08s both; }
  #tagline { margin-top:12px; font-size:min(4.4vw, 17px); letter-spacing:.34em; text-transform:uppercase; color:#ffb3ad; text-indent:.34em; min-height:1.4em; text-align:center; }
  #startBtn { margin-top:34px; background:transparent; color:#fff; border:2px solid #ff2a1e; border-radius:999px;
    padding:13px 38px; font-size:17px; font-weight:900; letter-spacing:.26em; text-indent:.26em; cursor:pointer;
    box-shadow:0 0 18px rgba(255,30,30,.45), inset 0 0 12px rgba(255,30,30,.25); opacity:0; }
  #hero.show #startBtn { animation:startIn .4s ease .55s forwards, pulseBtn 1.5s ease-in-out 1s infinite; }
  @keyframes startIn { to { opacity:1; } }
  @keyframes pulseBtn { 0%,100% { box-shadow:0 0 14px rgba(255,30,30,.4), inset 0 0 10px rgba(255,30,30,.2);} 50% { box-shadow:0 0 30px rgba(255,30,30,.85), inset 0 0 16px rgba(255,30,30,.4);} }

  #fadeout { position:fixed; inset:0; background:#000; opacity:0; pointer-events:none; transition:opacity .38s ease; z-index:8; }
  #fadeout.on { opacity:1; }
  #endcard { position:fixed; inset:0; background:#020202; z-index:9; display:none; flex-direction:column; align-items:center; justify-content:center; gap:18px; text-align:center; padding:24px; }
  #endcard.show { display:flex; }
  #endcard .big { font-size:22px; font-weight:800; }
  #endcard .small { color:#ffb3ad; font-size:14px; line-height:1.5; }
  #replay { background:#e50914; color:#fff; border:none; border-radius:12px; padding:13px 26px; font-size:16px; font-weight:800; letter-spacing:.08em; cursor:pointer; box-shadow:0 0 18px rgba(255,30,30,.5); }
  #hint { position:absolute; top:calc(10px + env(safe-area-inset-top)); right:14px; z-index:5; font-size:11px; letter-spacing:.18em; color:rgba(255,255,255,.45); text-transform:uppercase; }
</style>
</head>
<body>
<div id="stage">
  <div id="world">
    <div id="sky"></div>
    <div id="moon"></div>
    <div id="city">
      <svg viewBox="0 0 100 46" preserveAspectRatio="none" aria-hidden="true">
        <path d="M0,46 L0,26 L8,26 L8,18 L15,18 L15,30 L22,30 L22,12 L31,12 L31,24 L38,24 L38,16 L45,16 L45,28 L52,28 L52,20 L60,20 L60,31 L68,31 L68,14 L77,14 L77,25 L85,25 L85,19 L92,19 L92,29 L100,29 L100,46 Z" fill="#050507"/>
        <rect class="win" x="24.5" y="16" width="1.5" height="2.4"/>
        <rect class="win" x="70.5" y="18" width="1.5" height="2.4"/>
        <rect class="win" x="40.5" y="20" width="1.4" height="2.2"/>
        <rect class="win" x="87"   y="22" width="1.4" height="2.2"/>
        <rect class="win" x="10.5" y="21" width="1.4" height="2.2"/>
      </svg>
      <img id="roofSign" src="icon-512.png" alt="">
    </div>
  </div>
  <div id="flash"></div>
  <div id="hint">нажми — пропустить</div>

  <div id="hero">
    <img id="heroSign" src="icon-512.png" alt="TiradA">
    <div id="heroName">Tirad<b>A</b> anon</div>
    <div id="tagline"></div>
    <button id="startBtn">▶ Старт</button>
  </div>
</div>

<div id="fadeout"></div>
<div id="endcard">
  <div class="big">Дальше — само приложение 👻</div>
  <div class="small">Вариант 2 — «кинематографичный»: камера летит<br>через ночной город к знаку на крыше.</div>
  <button id="replay">↻ Смотреть ещё раз</button>
</div>

<script>
  var stage = document.getElementById('stage');
  var flash = document.getElementById('flash');
  var hero = document.getElementById('hero');
  var tagline = document.getElementById('tagline');
  var fade = document.getElementById('fadeout');
  var endcard = document.getElementById('endcard');
  var heroShown = false, typed = false;

  /* stars */
  var sky = document.getElementById('sky');
  for (var i = 0; i < 42; i++) {
    var s = document.createElement('div');
    s.className = 'star';
    var sz = (Math.random() * 1.8 + 0.8).toFixed(1);
    s.style.width = sz + 'px'; s.style.height = sz + 'px';
    s.style.left = (Math.random() * 100) + '%';
    s.style.top = (Math.random() * 55) + '%';
    s.style.animationDelay = (Math.random() * 2.6) + 's';
    sky.appendChild(s);
  }

  flash.classList.add('go');
  stage.classList.add('shake');

  function typeTagline(){
    if (typed) return; typed = true;
    var text = 'твой город · твои правила';
    var j = 0;
    var t = setInterval(function(){
      tagline.textContent = text.slice(0, ++j);
      if (j >= text.length) clearInterval(t);
    }, 34);
  }

  function showHero(){
    if (heroShown) return; heroShown = true;
    document.getElementById('world').style.display = 'none';
    flash.style.display = 'none';
    hero.classList.add('show');
    setTimeout(typeTagline, 500);
  }
  setTimeout(showHero, 3050);

  function start(){
    if (!heroShown) { showHero(); return; }
    fade.classList.add('on');
    setTimeout(function(){ endcard.classList.add('show'); }, 400);
  }
  stage.addEventListener('click', start);
  document.getElementById('replay').addEventListener('click', function(){ location.reload(); });
</script>
</body>
</html>
